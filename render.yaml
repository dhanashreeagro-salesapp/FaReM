services:
  # 1. Redis instance for Celery
  - type: redis
    name: farem-redis
    ipAllowList: []
    plan: free # Note: free redis does not persist data on restarts, but fine for celery broker

  # 2. Django Web Service
  - type: web
    name: farem-web
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: farem-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false # You will provide this from Supabase in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "8000"

  # 3. Celery Worker
  - type: worker
    name: farem-celery-worker
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    dockerCommand: celery -A ffma worker -l info
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: farem-redis
          property: connectionString
      - key: DATABASE_URL
        fromService:
          type: web
          name: farem-web
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: farem-web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"

  # 4. Celery Beat (Scheduler)
  - type: worker
    name: farem-celery-beat
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    dockerCommand: celery -A ffma beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: farem-redis
          property: connectionString
      - key: DATABASE_URL
        fromService:
          type: web
          name: farem-web
          envVarKey: DATABASE_URL
      - key: SECRET_KEY
        fromService:
          type: web
          name: farem-web
          envVarKey: SECRET_KEY
      - key: DEBUG
        value: "False"
