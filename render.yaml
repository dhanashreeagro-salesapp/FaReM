services:
  # 1. Redis instance for Celery
  - type: redis
    name: farem-redis
    ipAllowList: []
    plan: free # Free redis instance

  # 2. Django Web Service
  - type: web
    name: farem-web
    env: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    healthCheckPath: /
    envVars:
      - key: REDIS_URL
        fromService:
          type: redis
          name: farem-redis
          property: connectionString
      - key: DATABASE_URL
        sync: false # You will provide this from Supabase in the Render dashboard
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "8000"
      - key: CELERY_TASK_ALWAYS_EAGER
        value: "True"

